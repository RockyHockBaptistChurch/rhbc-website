name: Copy PDFs to Cloudflare R2

# Copies every bulletin and newsletter PDF into the church's Cloudflare R2 bucket
# (rhbc-files), keeping the same folder paths, then checks that the counts match.
# Runs when this file changes, whenever a PDF is added or changed, and by hand
# (Actions → Copy PDFs to Cloudflare R2 → Run workflow). It only adds and updates;
# it never deletes anything from R2.
# Uses the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID secrets.
on:
  push:
    branches: [main]
    paths:
      - "bulletins/**"
      - "newsletters/**"
      - ".github/workflows/r2-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-sync
  cancel-in-progress: false

env:
  BUCKET: rhbc-files
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /bulletins/
            /newsletters/
          sparse-checkout-cone-mode: false
      - name: Check the secrets are set
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do [ -n "${!v}" ] || { echo "::error::Missing R2 secret ($v)"; exit 1; }; done
          [ "$ENDPOINT" != "https://.r2.cloudflarestorage.com" ] || { echo "::error::Missing R2_ACCOUNT_ID secret"; exit 1; }
      - name: Copy PDFs to R2
        run: |
          for d in bulletins newsletters; do
            aws s3 sync "$d" "s3://$BUCKET/$d" --endpoint-url "$ENDPOINT" \
              --exclude "*" --include "*.pdf" --content-type application/pdf --only-show-errors
          done
      - name: Check every PDF is in R2
        run: |
          fail=0
          for d in bulletins newsletters; do
            here=$(find "$d" -type f -name '*.pdf' | wc -l)
            there=$(aws s3 ls "s3://$BUCKET/$d/" --recursive --endpoint-url "$ENDPOINT" | grep -c '\.pdf$' || true)
            echo "$d: $here in GitHub, $there in R2"
            echo "- **$d:** $here in GitHub, $there in R2" >> "$GITHUB_STEP_SUMMARY"
            [ "$there" -ge "$here" ] || fail=1
          done
          [ $fail -eq 0 ] || { echo "::error::Some PDFs are missing from R2"; exit 1; }
